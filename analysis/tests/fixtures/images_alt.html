<!DOCTYPE html>
<!-- Alt-text: saknat attribut, tomt alt (dekorativ), alt med text, role=presentation,
     aria-hidden, aria-label, lazy-load via data-src. -->
<html lang="sv">
<head><meta charset="utf-8"><title>Bilder</title></head>
<body>
<img src="/a.jpg">
<img src="/b.jpg" alt="">
<img src="/c.jpg" alt="   ">
<img src="/d.jpg" alt="Grävmaskin vid ett bygge">
<img src="/e.svg" role="presentation">
<img src="/f.svg" aria-hidden="true">
<img src="/g.jpg" aria-label="Karta över Gotland">
<img src="data:image/gif;base64,R0lGOD" data-src="/lazy.jpg">
</body>
</html>
